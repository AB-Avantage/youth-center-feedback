{% extends "feedback/base.html" %}
{% block title %}{{ copy.success_title }}{% endblock %}
{% block content %}
<section class="hero"><h1>{{ copy.success_title }}</h1></section>
<section class="card form-card"><p class="success-note">{{ copy.save_code }}</p><p>{{ copy.tracking_code }}</p><p><span class="code" dir="ltr">{{ reference }}</span></p><div class="actions"><a class="button" href="{% if language == 'ar' %}{% url 'submission_track_ar' %}{% else %}{% url 'submission_track_en' %}{% endif %}">{{ copy.track_tab }}</a><a class="button secondary" href="{% if language == 'ar' %}{% url 'submission_create_ar' %}{% else %}{% url 'submission_create_en' %}{% endif %}">{{ copy.another }}</a></div></section>
{% endblock %}
